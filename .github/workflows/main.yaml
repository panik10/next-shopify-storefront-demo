name: next-shopify-storefront-demo

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      environment:
        description: "Env deploy to"
        required: false
        type: choice
        options: ["development", "production"]
        # default: "development"
      nodejs_version:
        description: "Node version"
        required: false
        type: choice
        options: ["lts-alpine", "22-alpine", "24-alpine", "25-alpine"]
        default: "lts-alpine"

permissions:
  contents: read
  packages: write
  id-token: write
# Stops workflow if there is a newer workflow pending
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-ci:
    runs-on: ubuntu-latest
    env:
      SELECTED_ENV: >-
        ${{ 
          inputs.environment || 
          (github.ref == 'refs/heads/main' && 'production' || 'development') 
        }}
      node_version: >-
        ${{ 
          inputs.nodejs_version || 
          (github.ref == 'refs/heads/main' && '24-alpine' || 'lts-alpine') 
        }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d_%H-%M-%S')"

      - name: Extract version from tag
        id: version-extract
        uses: damienaicheh/extract-version-from-tag-action@v1.3.0

      - name: Set outputs
        id: version
        run: |
          echo "major=$MAJOR" >> $GITHUB_OUTPUT
          echo "minor=$MINOR" >> $GITHUB_OUTPUT
          echo "patch=$PATCH" >> $GITHUB_OUTPUT
          echo "version=$MAJOR.$MINOR.$PATCH" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ env.SELECTED_ENV }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build Docker Image
        uses: docker/build-push-action@v7.1.0
        with:
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          target: ${{ env.SELECTED_ENV }}
          labels: |
            com.my-cool-aid-company.developer="Developed by SeaSideSoftwares https://seasidesoftwares.com/"
            ${{ steps.meta.outputs.labels }}
          secrets: |
            "DOT_ENV=${{ secrets.DOT_ENV }}"

          # Saved for demonstration purposes
          # tags: |
          #   ghcr.io/${{ github.repository }}-${{ env.SELECTED_ENV }}:${{ steps.version.outputs.major }}
          #   ghcr.io/${{ github.repository }}-${{ env.SELECTED_ENV }}:${{ steps.version.outputs.major }}-${{ inputs.node_version }}
          #   ghcr.io/${{ github.repository }}-${{ env.SELECTED_ENV }}:${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}
          #   ghcr.io/${{ github.repository }}-${{ env.SELECTED_ENV }}:${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}-${{ inputs.node_version }}
          #   ghcr.io/${{ github.repository }}-${{ env.SELECTED_ENV }}:${{ steps.version.outputs.version }}
          #   ghcr.io/${{ github.repository }}-${{ env.SELECTED_ENV }}:${{ steps.version.outputs.version }}-${{ inputs.node_version }}
          #   ghcr.io/${{ github.repository }}-${{ env.SELECTED_ENV }}:latest
          #   ghcr.io/${{ github.repository }}-${{ env.SELECTED_ENV }}:${{ github.sha }}
          # labels: |
          #   org.opencontainers.image.url=${{ github.repositoryUrl }}
          #   org.opencontainers.image.title=${{ github.repository }}
          #   org.opencontainers.image.revision=${{ github.sha }}
          #   org.opencontainers.image.created=${{ steps.date.outputs.date }}
          #   org.opencontainers.image.version=${{ steps.version.outputs.version }}
          #   org.opencontainers.image.description=${{ github.event.repository.description || 'Visit https://my-cool-aid-company.com/ for details' }}
          #   org.opencontainers.image.source=${{ github.repositoryUrl}}

          # List of metadata for an image
          # labels: |
          #   org.opencontainers.image.source "ghcr.io/${{ github.repository }}"
          #   org.opencontainers.image.version "${{ steps.version.outputs.major }}.${{ steps.version.outputs.minor }}.${{ steps.version.outputs.patch }}"
          #   com.panik.sha "${{ github.sha }}"

